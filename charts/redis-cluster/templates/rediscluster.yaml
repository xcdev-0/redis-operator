{{- if .Values.redisCluster.enabled }}
apiVersion: ejlabs.in/v1beta2
kind: RedisCluster
metadata:
  name: {{ include "redis-cluster.resourceName" . }}
  namespace: {{ include "redis-cluster.namespace" . }}
  labels:
    {{- include "redis-cluster.labels" . | nindent 4 }}
    {{- with .Values.redisCluster.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.redisCluster.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml .Values.redisCluster.spec | nindent 2 }}
{{- end }}
