apiVersion: cluster.redisutils.ejlabs.in/v1beta2
kind: RedisCluster
metadata:
  name: test-redis-cluster
  namespace: default
spec:
  clusterSize: 3
  clusterVersion: v7
  persistenceEnabled: true
  
  storage:
    nodeConfVolume: true
    nodeConfVolumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
  
  redisLeader:
    replicaCount: 3
    redisConfig: {}
  
  redisFollower:
    replicaCount: 3
    redisConfig: {}
  
  kubernetesConfig:
    image: redis:7.2-alpine
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi
