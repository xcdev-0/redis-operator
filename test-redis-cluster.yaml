apiVersion: ejlabs.in/v1beta2
kind: RedisCluster
metadata:
  name: second5
  namespace: default
spec:
  clusterSize: 4
  clusterVersion: v7
  
  storage:
    additionalVolumeAndMounts:
      volumes:
        - name: test-volume
          emptyDir: {}
      volumeMounts:
        - name: test-volume
          mountPath: /test-volume
    node:
      enabled: true
      persistentVolumeClaim:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 100Mi
    data:
      enabled: true
      persistentVolumeClaim:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
  
  redisLeader:
    # replicaCount: 3
    redisConfig: {}
    containerSecurityContext:
      capabilities:
        add:
          - NET_ADMIN
          - NET_RAW
  
  redisFollower:
    # replicaCount: 3
    redisConfig: {}
    containerSecurityContext:
      capabilities:
        add:
          - NET_ADMIN
          - NET_RAW
  
  kubernetesConfig:
    image: redis:7.2-alpine
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi
    service:
      serviceType: ClusterIP
  
  # Redis Exporter 설정 (Prometheus 메트릭 수집)
  redisExporter:
    enabled: true
    image: oliver006/redis_exporter:latest
    imagePullPolicy: IfNotPresent
    # port: 9121  # 기본 포트 (생략 가능)
    # resources:
    #   requests:
    #     cpu: 50m
    #     memory: 64Mi
    #   limits:
    #     cpu: 100m
    #     memory: 128Mi
    # 추가 환경변수 (선택사항)
    # envVars:
    #   - name: REDIS_EXPORTER_LOG_LEVEL
    #     value: "info"
