apiVersion: rediscluster.ejlabs.in/v1beta2
kind: RedisCluster
metadata:
  name: test-redis-cluster
  namespace: default
spec:
  clusterSize: 3
  clusterVersion: v7
  
  storage:
    node:
      enabled: true
      claimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 100Mi
    data:
      enabled: true
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
  
  redisLeader:
    replicaCount: 3
    redisConfig: {}
  
  redisFollower:
    replicaCount: 3
    redisConfig: {}
  
  kubernetesConfig:
    image: redis:7.2-alpine
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi
