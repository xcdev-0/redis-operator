# ========================================
# defaultRedisConfig (기본 하드코딩)
# ========================================
bind 0.0.0.0 ::
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
supervised no
pidfile /var/run/redis.pid

# ========================================
# applyAuth() - 인증 설정
# ========================================
masterauth mypassword
requirepass mypassword
protected-mode yes

# ========================================
# applyCluster() - 클러스터 설정
# ========================================
cluster-announce-ip 10.244.0.50
cluster-announce-hostname test-redis-cluster-leader-0.test-redis-cluster-leader-headless.default.svc.cluster.local
cluster-enabled yes
cluster-node-timeout 5000
cluster-require-full-coverage no
cluster-migration-barrier 1
cluster-config-file /node-conf/nodes.conf

# ========================================
# applyTLS() - TLS 비활성화 (ClusterIP + TLS=false)
# ========================================
# (아무것도 추가 안 됨)

# ========================================
# applyPersistence() - 데이터 영속화
# ========================================
save 900 1
save 300 10
save 60 10000
Appendonly yes
Appendfilename "Appendonly.aof"
dir /data

# ========================================
# applyPort() - 포트 설정 (TLS=false)
# ========================================
port 6379

# ========================================
# applyMemory() - 메모리 제한 미설정
# ========================================
# (아무것도 추가 안 됨)

# ========================================
# applyExternalConfig() - 외부 ConfigMap 설정
# ========================================
include /etc/redis/external.conf.d/custom.conf
