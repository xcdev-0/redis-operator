apiVersion: redis.ej.io/v1beta2
kind: RedisCluster
metadata:
  name: my-redis-cluster
  namespace: redis
  labels:
    app: redis-cluster
  annotations:
    description: "Full sample RedisCluster CR"
spec:
  # ===== 기본 클러스터 설정 =====
  clusterSize: 3
  clusterVersion: v7
  clientPort: 6379
  hostPort: 30379
  hostNetwork: false

  # ===== Kubernetes 기본 설정 =====
  kubernetesConfig:
    # -- 이미지 설정 --
    image: redis:7.2-alpine
    imagePullPolicy: IfNotPresent
    imagePullSecrets:
      - name: my-registry-secret

    # -- 리소스 설정 (Leader/Follower 미설정 시 기본값) --
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

    # -- Redis 비밀번호 Secret 참조 --
    redisSecret:
      name: redis-password-secret
      key: password

    # -- StatefulSet 설정 --
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Delete
    minReadySeconds: 10

    # -- Service 설정 --
    service:
      serviceType: ClusterIP
      annotations:
        prometheus.io/scrape: "true"
      includeBusPort: true
      additional:
        type: NodePort
        enabled: true
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
        includeBusPort: false

    # -- 패치 비교 시 무시할 어노테이션 --
    ignoreAnnotations:
      - kubectl.kubernetes.io/last-applied-configuration

  serviceAccountName: redis-cluster

  # ===== Redis Leader 설정 =====
  redisLeader:
    replicaCount: 3
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "512Mi"
    redisConfig:
      maxMemoryPercentOfLimit: 80
      additionalRedisConfig: redis-leader-extra-config
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - redis-cluster-leader
            topologyKey: kubernetes.io/hostname
    nodeSelector:
      role: redis
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: redis-cluster-leader
    tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "redis"
        effect: "NoSchedule"
    containerSecurityContext:
      runAsUser: 1000
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
    readinessProbe:
      exec:
        command:
          - redis-cli
          - ping
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 3
    livenessProbe:
      exec:
        command:
          - redis-cli
          - ping
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 5
    pdb:
      enabled: true
      minAvailable: 2
    terminationGracePeriodSeconds: 60

  # ===== Redis Follower 설정 =====
  redisFollower:
    replicaCount: 3
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
    redisConfig:
      maxMemoryPercentOfLimit: 80
      additionalRedisConfig: redis-follower-extra-config
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - redis-cluster-follower
            topologyKey: kubernetes.io/hostname
    nodeSelector:
      role: redis
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: redis-cluster-follower
    tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "redis"
        effect: "NoSchedule"
    containerSecurityContext:
      runAsUser: 1000
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
    readinessProbe:
      exec:
        command:
          - redis-cli
          - ping
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 3
    livenessProbe:
      exec:
        command:
          - redis-cli
          - ping
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 5
    pdb:
      enabled: true
      minAvailable: 2
    terminationGracePeriodSeconds: 60

  # ===== Redis 공통 설정 (Leader/Follower 개별 설정 없을 때 사용) =====
  redisConfig:
    maxMemoryPercentOfLimit: 75
    additionalRedisConfig: redis-common-extra-config
	dynamicConfig:
      - "hz 100"
      - "lfu-log-factor 10"
  # ===== 스토리지 설정 =====
  storage:
    # Redis 데이터 PVC
    data:
      enabled: true
      keepAfterDelete: true
      volumeClaimTemplate:
        metadata:
          name: redis-data
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: standard
          resources:
            requests:
              storage: 10Gi

    # Redis 노드 설정 PVC
    node:
      enabled: true
      volumeClaimTemplate:
        metadata:
          name: redis-node-conf
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: standard
          resources:
            requests:
              storage: 1Gi

    # 추가 볼륨 & 마운트
    additionalVolumeAndMounts:
      volumes:
        - name: custom-scripts
          configMap:
            name: redis-scripts
      volumeMounts:
        - name: custom-scripts
          mountPath: /scripts
          readOnly: true

  # ===== TLS 설정 =====
  TLS:
    secret:
      secretName: redis-tls-secret
    caKey: ca.crt
    certKey: tls.crt
    keyKey: tls.key

  # ===== ACL 설정 =====
  acl:
    secret:
      secretName: redis-acl-secret
    # persistentVolumeClaim: redis-acl-pvc  # secret이 우선순위 높음

  # ===== Pod 보안 설정 =====
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true

  priorityClassName: high-priority

  # ===== 사이드카 컨테이너 =====
  sidecars:
    - name: log-collector
      image: fluent/fluent-bit:2.1
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
      env:
        - name: LOG_LEVEL
          value: "info"
      mountPath:
        - name: redis-data
          mountPath: /var/log/redis
          readOnly: true
      command:
        - /fluent-bit/bin/fluent-bit
        - -c
        - /fluent-bit/etc/fluent-bit.conf
      ports:
        - containerPort: 2020
          name: metrics
          protocol: TCP
      securityContext:
        runAsUser: 1000
        readOnlyRootFilesystem: true

  # ===== Redis Exporter (모니터링) =====
  redisExporter:
    enabled: true
    port: 9121
    image: oliver006/redis_exporter:v1.58.0
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
    env:
      - name: REDIS_EXPORTER_LOG_FORMAT
        value: "json"
      - name: REDIS_EXPORTER_INCL_SYSTEM_METRICS
        value: "true"
    securityContext:
      runAsUser: 1000
      runAsNonRoot: true
      readOnlyRootFilesystem: true

  # ===== 환경 변수 =====
  env:
    - name: TZ
      value: "Asia/Seoul"
    - name: REDIS_CLUSTER_ANNOUNCE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP